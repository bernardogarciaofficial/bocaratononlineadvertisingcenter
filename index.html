<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Boca Raton Visitor Guide</title>
  <meta name="description" content="Free Boca Raton business ad wall. Email your video or image ad to be posted." />
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<header class="topbar">
  <div class="wrap row">
<div class="logoCenter">
  <img src="media/palm-logo.png" alt="Palm Logo">
</div>
    <div class="brand">
      

      <div class="brandText">
        <h1>Boca Raton Visitor Guide</h1>
        <p class="sub">Independent Local Directory</p>
        <p class="line">
          A free local business video wall for Boca Raton. Browse 100 ad slots instantly.
        </p>
      </div>
    </div>

    

  </div>
</header>

<main class="wrap">

  
  <section class="grid" id="grid"></section>

</main>

<footer class="footer wrap">
  © <span id="year"></span> Boca Raton Online Advertising Center • Built on GitHub Pages
</footer>

<!-- Modal -->
<div class="modal" id="modal" aria-hidden="true">
  <div class="modalBox" role="dialog" aria-modal="true" aria-labelledby="modalTitle">

    <div class="modalHead">
      <div class="modalTitle" id="modalTitle">Ad</div>
      <button class="closeBtn" id="closeBtn" type="button">Close</button>
    </div>

    <div class="modalBody" id="modalBody"></div>
    <div class="modalFoot" id="modalFoot"></div>

  </div>
</div>

<script src="script.js"></script>

</body>
</html>
