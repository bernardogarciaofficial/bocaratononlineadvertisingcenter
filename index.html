<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Boca Raton Visitor Guide</title>
    <meta
      name="description"
      content="Boca Raton Visitor Guide — Independent local directory and advertising opportunities."
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="topbar">
      <div class="wrap row">
        <div class="logoCenter">
          <img src="media/palm-logo.png" alt="Palm Logo" />
        </div>

        <div class="brand">
          <div class="brandText">
            <h1>Boca Raton Visitor Guide</h1>
            <p class="sub">Independent Local Directory</p>
          </div>
        </div>

        <div class="right">
          <a class="btn primary" id="emailBtn" href="#" aria-label="Email us"></a>
          <span class="pill" id="countPill">100 SLOTS</span>
        </div>
      </div>
    </header>

    <main class="wrap">
      <section class="info">
        <p class="line">
          For advertising opportunities on this Boca Raton Independent Local Directory, please
          email <b>teleunionlatina@hotmail.com</b>/or call <a href="tel:+15619041228"><b>(561) 904-1228</b></a>
        </p>
      </section>

      <!-- 100 video slots are generated by script.js into this grid container -->
      <section class="grid" id="grid"></section>
    </main>

    <footer class="footer wrap">
      © <span id="year"></span> Boca Raton Online Advertising Center • Built on GitHub Pages
    </footer>

    <!-- Modal -->
    <div class="modal" id="modal" aria-hidden="true">
      <div class="modalBox" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modalHead">
          <div class="modalTitle" id="modalTitle">Ad</div>
          <button class="closeBtn" id="closeBtn" type="button">Close</button>
        </div>

        <div class="modalBody" id="modalBody"></div>
        <div class="modalFoot" id="modalFoot"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
